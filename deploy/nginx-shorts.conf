# /etc/nginx/sites-available/shorts 로 복사해 쓴다.
#   ln -s /etc/nginx/sites-available/shorts /etc/nginx/sites-enabled/
#   certbot --nginx -d shorts.example.com
server {
    server_name shorts.example.com;

    # 🔴 원본 영상과 렌더된 클립이 오간다. nginx 기본값(1m)이면 업로드가 413 으로 잘린다.
    client_max_body_size 2g;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 🔴 이게 없으면 앱이 요청을 http 로 보고 Secure 쿠키를 거부당하는 상황을 못 읽는다.
        proxy_set_header X-Forwarded-Proto $scheme;

        # STT 와 렌더는 잡으로 빠지지만, 유튜브 다운로드처럼 응답이 늦는 경로가 있다.
        # nginx 기본 60s 면 그런 요청이 504 로 끊긴다.
        proxy_read_timeout 300s;

        # 클립 재생은 range 요청이다. 버퍼링을 끄면 탐색(seek)이 즉시 반응한다.
        proxy_buffering off;
    }

    listen 80;
}
