# /etc/nginx/sites-available/clipq 로 복사해 쓴다.
#   scp deploy/nginx-shorts.conf root@211.233.199.11:/etc/nginx/sites-available/clipq
#   ln -s /etc/nginx/sites-available/clipq /etc/nginx/sites-enabled/
#   certbot --nginx -d clipq.cloud -d www.clipq.cloud
#
# 🔴 certbot 은 **이 파일을 직접 고친다** — 443 server 블록과 http→https 리다이렉트를 여기에
# 써넣는다. 그래서 인증서를 받은 뒤의 서버 파일은 이 레포 파일과 달라진다. 이 파일을 다시
# 복사하면 certbot 이 넣은 것이 통째로 날아가므로, 그때는 복사 후 `certbot --nginx` 를 다시
# 돌리거나 서버 파일을 직접 고친다.

server {
    server_name clipq.cloud;

    # 🔴 HSTS — 브라우저에게 "이 도메인은 https 로만" 을 기억시킨다. 없으면 주소창에 도메인만
    # 친 **첫 요청이 평문으로 나가고**, 그 요청을 가로챈 중간자가 브라우저에는 계속 http 로
    # 응답하면서 자기만 서버와 https 로 말할 수 있다(sslstrip). 세션 쿠키는 Secure 라 안 새지만
    # 로그인 폼에 친 관리자 비밀번호는 그 첫 요청에 실린다.
    # `always` 는 301·4xx 같은 응답에도 붙이라는 뜻이다 — www 블록처럼 301 만 하는 곳에 필요하다.
    # 🔴 되돌리기 어렵다: max-age 동안 브라우저가 기억하므로, 해제하려면 max-age=0 을 서빙하고
    # 방문자가 **다시 올 때까지** 기다려야 한다. `preload` 는 넣지 않는다 — 브라우저에 내장되는
    # 목록이라 빼는 데 몇 달이 걸린다. certbot 이 443 블록을 만들 때 이 줄을 함께 복제해 간다.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 🔴 원본 영상과 렌더된 클립이 오간다. nginx 기본값(1m)이면 업로드가 413 으로 잘린다.
    client_max_body_size 2g;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        # 🔴 시청자 레이트리밋(answers/viewers._client_ip)이 **이 헤더를 직접 읽는다.**
        # 없으면 앱은 docker 브리지 게이트웨이(172.x.0.1)만 보게 되고, 전 세계 시청자가
        # 한 IP 로 묶여 질문 상한에 다 같이 걸린다. $remote_addr 로 덮어쓰므로 클라이언트가
        # 보낸 위조 값은 버려진다.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 🔴 이게 없으면 앱이 요청을 http 로 보고 Secure 쿠키를 거부당하는 상황을 못 읽는다.
        proxy_set_header X-Forwarded-Proto $scheme;

        # STT 와 렌더는 잡으로 빠지지만, 유튜브 다운로드처럼 응답이 늦는 경로가 있다.
        # nginx 기본 60s 면 그런 요청이 504 로 끊긴다.
        proxy_read_timeout 300s;

        # 클립 재생은 range 요청이다. 버퍼링을 끄면 탐색(seek)이 즉시 반응한다.
        proxy_buffering off;
    }

    listen 80;
}

# 🔴 www 는 apex 로 301 한다. 취향이 아니라 **쿠키 때문**이다.
# 세션 쿠키와 시청자 익명 쿠키(sm_viewer)는 오리진마다 따로 생긴다. 두 호스트를 다 서비스하면
# 같은 사람이 www 로 들어왔다 apex 로 옮길 때 다시 로그인해야 하고, 시청자는 둘로 세어져
# 질문 중복 방지(answers/viewers)와 퍼널 집계(answers/events)가 그만큼 헐거워진다.
server {
    server_name www.clipq.cloud;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://clipq.cloud$request_uri;
    listen 80;
}
