# shorts_maker 는 backend 와 **별개 서비스**지만 같은 도커 네트워크에 붙는다.
# backend 의 Spring 이 프록시하므로(설계 문서 §13) 이 서비스는 관리자 인증을 하지 않는다 —
# 🔴 그래서 포트를 호스트에 열지 않는다. 도커 네트워크 안에서만 닿아야 한다.
services:
  shorts:
    build: .
    restart: unless-stopped
    # SHORTS_API_TOKEN, GEMINI_API_KEY 는 여기서 온다. 없으면 기동이 거부된다.
    env_file: .env
    volumes:
      # DB 와 중간 산출물. 컨테이너를 다시 만들어도 전사 결과가 남아야 한다
      # (30분 STT 한 번에 4분 넘게 걸린다).
      - shorts-data:/data
      # 원본 영상은 바인드 마운트다 — `scp` 로 서버에 올리면 바로 보인다.
      # 업로드 기능이 아직 없어서 이게 유일한 투입 경로다.
      - ./sources:/sources
    mem_limit: 1400m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8100/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  shorts-data:

# 🔴 backend 의 네트워크에 얹는다. backend 가 먼저 떠 있어야 이 compose 가 뜬다.
networks:
  default:
    name: backend_default
    external: true
