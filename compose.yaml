# shorts_maker 단독 스택. **로컬 개발도 이 파일로 띄운다**(2026-09-04 부터) — 운영과 같은
# 이미지·같은 경로·같은 폰트에서 돌려야 "내 맥에선 되는데"가 없다. 예전에는 backend(Spring) 의
# `backend_default` 네트워크에 얹혀 포트를 열지 않았지만, 독립하면서 그 의존이 사라졌다.
#
#   로컬:  브라우저 ──127.0.0.1:8100──> shorts 컨테이너   (vite dev 는 :5173 → :8100 프록시)
#   운영:  인터넷 ──443──> nginx (VM) ──127.0.0.1:8100──> shorts 컨테이너
#
# DB 는 Postgres 컨테이너(`db`)다(2026-09-06, SQLite 에서 전환 — db/store.py 주석). 데이터는 `shorts-pg`
# 볼륨, 중간 산출물(청크·클립)은 `shorts-data` 볼륨. `docker compose down -v` 면 둘 다 사라진다.
# 🔴 backend/.env 에 POSTGRES_PASSWORD 가 있어야 db 가 뜬다. 두 서비스가 같은 env_file 로 같은 값을 본다.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      POSTGRES_USER: shorts
      POSTGRES_DB: shorts
    # 🔴 루프백에만 연다. 호스트에서 `uv run sm …`·테스트(shorts_test DB)가 붙기 위한 것이지 외부용이 아니다.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - shorts-pg:/var/lib/postgresql/data
    # 🔴 상한이 없으면 db 가 새는 순간 커널 OOM Killer 가 **관계없는** shorts 를 골라 죽인다.
    #
    # 600m (2026-09-16, 커넥션 풀을 20으로 올리며). **연결 때문이 아니다** — 실측으로 연결 하나는
    # 1.8MB 다(이 컨테이너에서 기준선 47MiB → 20연결 유지 81MiB). 풀 20의 정상 상태는 83MB 라
    # 400m 로도 남았다. 상한을 올린 건 이번 측정에 안 잡히는 **꼬리** 때문이다:
    #   · autovacuum: maintenance_work_mem 64MB × autovacuum_max_workers 3 = 최악 192MB.
    #     테이블이 작은 지금은 훨씬 적지만 utterances 는 영상이 쌓일수록 커진다 — 가장 큰 한 항목이다
    #   · work_mem 4MB × 정렬 × 연결. 지금 SQL 은 수백 행 정렬이라 닿지 않지만 연결이 20이면 꼬리가 길다
    #   · shared_buffers 128MB 는 공유라 한 번만 센다
    # 🔴 스왑은 여유로 치지 않는다. DB 가 스왑에 들어가면 "안 죽는데 느린" 상태가 되어 원인을 못 찾는다.
    mem_limit: 600m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorts -d shorts"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  shorts:
    build: .
    # 🔴 태그를 고정한다. 안 쓰면 compose 가 디렉터리 이름으로 `shorts_maker-shorts` 를 만드는데,
    # 그러면 레포를 다른 이름의 폴더에 두는 순간 이미지 이름이 달라져 롤백 태그(`shorts-maker:prev`,
    # scripts/deploy.sh)가 어긋난다. 롤백은 `docker tag shorts-maker:prev shorts-maker:latest` 한 줄이다.
    image: shorts-maker:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # 🔴 SHORTS_ADMIN_PASSWORD 와 GEMINI_API_KEY 가 여기서 온다.
    # 비밀번호가 없으면 컨테이너가 0.0.0.0 에 바인딩하므로 기동을 거부한다.
    env_file: ./backend/.env
    # 🔴 env_file 은 .env 의 **모든** 키를 컨테이너에 넣는다. 로컬 .env 에는 호스트용 값
    # (SHORTS_FFMPEG=/opt/homebrew/..., SHORTS_SOURCE_DIR=sources, 폰트 이름)이 있고, 그게 들어오면
    # 이미지의 ENV 를 덮어 컨테이너 안에서 ffmpeg 를 못 찾거나 DB 가 볼륨 밖에 생긴다.
    # `environment` 는 env_file 보다 우선하므로 컨테이너 전용 값은 여기서 고정한다.
    environment:
      SHORTS_API_HOST: 0.0.0.0
      SHORTS_API_PORT: "8100"
      SHORTS_DB_HOST: db
      # 커넥션 풀 상한. 여럿이 동시에 화면을 볼 때를 위한 값이다(2026-09-16).
      # 🔴 호스트에서 도는 `uv run sm`·테스트는 이 값을 못 본다 — 기본 8로 돈다. 그래도 되는 게
      # CLI 는 프로세스 하나에서 순차로 일한다. 이 값이 필요한 건 API 프로세스뿐이다.
      SHORTS_DB_POOL_MAX: "20"
      SHORTS_WORK_DIR: /data/work
      SHORTS_SOURCE_DIR: /sources
      SHORTS_WEB_DIR: /app/web
      SHORTS_FFMPEG: ffmpeg
      SHORTS_SUBTITLE_FONT: NanumGothic
    # 🔴 루프백에만 바인딩한다. TLS 와 접근 로그는 nginx 가 맡고, 컨테이너를 인터넷에
    # 직접 노출하지 않는다 — 방화벽(ACG) 하나에만 의존하지 않게 된다.
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      # 중간 산출물(청크 wav·클립·미리보기). 컨테이너를 다시 만들어도 남아야 한다.
      - shorts-data:/data
      # 원본 영상은 바인드 마운트다 — 로컬은 파일을 이 폴더에 두고, 서버는 `scp` 로 올리면 바로 보인다.
      # 화면의 유튜브 URL 등록이 주 경로이고, 이건 큰 파일을 직접 넣을 때 쓴다.
      # DB 에는 이 디렉터리 기준 상대경로만 들어간다(config.Config.store_source).
      - ./backend/sources:/sources
    # 🔴 4GB VM 에서 이 서비스가 **유일한 워크로드**라는 전제다(backend 와 같은 VM 을 쓰던
    # 시절의 1400m 에서 올렸다). 다른 것을 같은 VM 에 얹으면 여기부터 다시 계산해야 한다.
    #
    # 배분(2026-09-16, db 를 600m 으로 올리며 다시 잡았다. VM 은 NCP c2-g3a = vCPU 2 / 4GB):
    #   물리 3.8Gi(3891MB) = shorts 2600m + db 600m + 나머지 ~690MB(OS·sshd·docker 데몬·nginx)
    # 🔴 db 가 가져간 200MB 는 **OS 여유에서 나왔다.** 여기가 빠듯해지면 먼저 줄일 곳은 shorts 다 —
    # whisper small 추론이 실측 1.1GB 라 2600m 에는 아직 슬랙이 있다(make_shorts §7).
    # 3000m 이던 값을 내린 이유는 여유가 남아서가 아니라 **db 에 상한이 없었기 때문**이다 —
    # 둘을 합치면 물리보다 커서, 한쪽이 새면 커널이 아무 컨테이너나 골라 죽이는 배분이었다.
    # whisper `small` 추론이 실측 1.1GB(make_shorts §7)라 2600m 는 ffmpeg 와 겹쳐도 여유가 있고,
    # 애초에 잡 워커가 1개라 STT 와 렌더는 겹치지 않는다.
    # swap 2GB 는 서버 위 `npm ci`·vite 빌드가 튀는 **그 순간**의 안전망이지 상시 여유가 아니다.
    mem_limit: 2600m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # /health 는 무인증이다. 인증이 걸린 경로를 쓰면 헬스체크가 로그인부터 해야 한다.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8100/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  shorts-data:
  shorts-pg:
